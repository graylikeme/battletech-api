apiVersion: apps/v1
kind: Deployment
metadata:
  name: battletech-roster
  namespace: battletech
  labels:
    app: battletech-roster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: battletech-roster
  template:
    metadata:
      labels:
        app: battletech-roster
    spec:
      containers:
        - name: roster
          image: ghcr.io/graylikeme/battletech-roster:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: battletech-roster
  namespace: battletech
spec:
  selector:
    app: battletech-roster
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: battletech-roster
  namespace: battletech
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - roster.battledroids.ru
      secretName: roster-battledroids-ru-tls
  rules:
    - host: roster.battledroids.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: battletech-roster
                port:
                  number: 80
